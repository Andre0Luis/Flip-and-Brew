version: 2
updates:
  # O app: o Expo fixa as versões de cada SDK, então saltos de versão maior ficam por conta de quem atualiza o SDK.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: npm
    directory: /packages/shared
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message:
      prefix: 'ci(deps)'
