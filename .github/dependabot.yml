version: 2
updates:
  # O app: o Expo fixa as versões de cada SDK, então saltos de versão maior ficam por conta de quem atualiza o SDK.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major']
      # O Expo SDK fixa react, react-dom e @types/react em versões exatas (expo-doctor reprova as outras): sobem com o SDK.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'
      # eslint 10 quebra o plugin de React do eslint-config-expo; o config também acompanha o SDK.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-expo'
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: npm
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: npm
    directory: /packages/shared
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message:
      prefix: 'ci(deps)'
