name: CI API

# Só roda quando o backend, o pacote compartilhado ou o cliente da API usado pelo app (apiClient.ts, que o teste de contrato importa) mudam.
# O CI do app (ci.yml) só roda quando o app muda.
on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/shared/**', 'apps/mobile/src/lib/cloud/apiClient.ts', '.github/workflows/ci-api.yml']
  pull_request:
    paths: ['apps/api/**', 'packages/shared/**', 'apps/mobile/src/lib/cloud/apiClient.ts', '.github/workflows/ci-api.yml']

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          npm ci --ignore-scripts --prefix packages/shared
          npm ci --ignore-scripts --prefix apps/api

      # Os testes usam um Postgres embutido (PGlite), sem serviço externo, e aplicam as migrações de verdade.
      - name: Typecheck e testes
        working-directory: apps/api
        run: |
          npx tsc --noEmit
          node --import tsx --test "src/**/*.test.ts" "../../packages/shared/src/**/*.test.ts"

      # Se o esquema mudou sem gerar a migração, falha aqui.
      - name: Migrações em dia
        working-directory: apps/api
        run: npx drizzle-kit check
