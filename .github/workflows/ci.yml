name: CI Mobile

# Só roda quando o app muda. O backend e o pacote compartilhado têm o próprio CI (ci-api.yml).
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/ci.yml']

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # O app Expo fica em apps/mobile; o backend tem o próprio CI (ci-api.yml).
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # Garante que o JavaScript do app empacota para Android. Não substitui rodar no aparelho.
      - name: Bundle Android
        run: npx expo export --platform android --output-dir dist
