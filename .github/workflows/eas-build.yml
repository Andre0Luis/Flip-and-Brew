name: EAS Build

# Depois de um merge na main que MEXA NO APP, dispara no EAS um APK de preview e um AAB de produção (Android).
# Mudança só no backend (apps/api), no pacote compartilhado, em documentação ou em outros workflows não gasta build nem sobe versão.
# Quando o app for movido para apps/mobile, troque os caminhos abaixo por apps/mobile/** e packages/shared/**.
# Precisa do segredo EXPO_TOKEN no GitHub (Settings > Secrets and variables > Actions).
# As variáveis EXPO_PUBLIC_* ficam no EAS (eas env), não aqui.

on:
  push:
    branches: [main]
    # Só o que entra no app. Os padrões sem barra ('package.json') valem para a raiz; o apps/api/package.json não dispara.
    paths:
      - 'src/**'
      - 'assets/**'
      - 'modules/**'
      - 'plugins/**'
      - 'index.ts'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eas-build.yml'
  workflow_dispatch:

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [preview, production]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      # --no-wait: o job só enfileira o build; o andamento e o download ficam em expo.dev.
      - name: Enfileirar build Android (${{ matrix.profile }})
        run: eas build --platform android --profile ${{ matrix.profile }} --non-interactive --no-wait
