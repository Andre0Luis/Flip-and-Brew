name: Vercel checks

# Verificações que a Vercel pode exigir antes de promover um deploy a produção
# (projeto na Vercel › Settings › Deployment Checks › Connect GitHub Actions).
# A Vercel avisa o GitHub com um `repository_dispatch` quando um deploy fica pronto; este workflow testa o commit desse deploy
# e devolve o resultado como status "Vercel - flip-and-brew: lint-gh" (o nome precisa bater com o que está no painel da Vercel).
#
# Atenção: `repository_dispatch` só dispara se este arquivo estiver na branch padrão (main). O `workflow_dispatch` serve para testar à mão.
on:
  repository_dispatch:
    types:
      - 'vercel.deployment.ready'
      - 'vercel.deployment.success'
  workflow_dispatch:

concurrency:
  group: vercel-checks-${{ github.event.client_payload.git.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  lint-gh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Precisa vir primeiro: marca o status como pendente agora e, no fim do job (post), como sucesso ou falha.
      - name: notify vercel
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - flip-and-brew: lint-gh'

      # O `repository_dispatch` roda no último commit da main; esta ação baixa o commit do deploy que está sendo verificado.
      - name: Baixar o commit do deploy
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/checkout@v1
      - name: Baixar o código (execução manual)
        if: github.event_name != 'repository_dispatch'
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          npm ci --ignore-scripts --prefix packages/shared
          npm ci --ignore-scripts --prefix apps/api

      - name: Typecheck e testes da API
        working-directory: apps/api
        run: |
          npx tsc --noEmit
          node --import tsx --test "src/**/*.test.ts" "../../packages/shared/src/**/*.test.ts"

      - name: Migrações em dia
        working-directory: apps/api
        run: npx drizzle-kit check
